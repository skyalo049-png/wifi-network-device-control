<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WiFi Network Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-shell"></div>
    <main class="dashboard">
        <section class="hero">
            <div>
                <p class="eyebrow">Live WiFi Visibility</p>
                <h1>Network Monitoring Dashboard</h1>
                <p class="hero-copy">
                    Scan your local network, inspect discovered devices, and refresh the view every 10 seconds.
                </p>
            </div>
            <div class="hero-meta">
                <div class="stat">
                    <span class="stat-label">Devices</span>
                    <strong id="device-count">0</strong>
                </div>
                <div class="stat">
                    <span class="stat-label">Last Scan</span>
                    <strong id="last-scan">Waiting</strong>
                </div>
            </div>
        </section>

        <section class="toolbar">
            <div id="status-pill" class="status-pill status-idle">Idle</div>
            <div class="toolbar-copy">
                <span id="subnets">No subnet scanned yet.</span>
                <button id="refresh-button" type="button">Refresh Now</button>
            </div>
        </section>

        <section id="error-banner" class="error-banner hidden"></section>
        <section id="devices" class="device-grid"></section>
    </main>

    <template id="device-card-template">
        <article class="device-card">
            <div class="card-header">
                <div>
                    <p class="device-type"></p>
                    <h2 class="device-name"></h2>
                </div>
                <span class="device-badge">Online</span>
            </div>
            <dl class="device-details">
                <div>
                    <dt>IP Address</dt>
                    <dd class="device-ip"></dd>
                </div>
                <div>
                    <dt>MAC Address</dt>
                    <dd class="device-mac"></dd>
                </div>
                <div>
                    <dt>Vendor</dt>
                    <dd class="device-vendor"></dd>
                </div>
            </dl>
            <div class="ports-block">
                <div class="ports-header">
                    <span>Open Ports</span>
                    <strong class="port-count"></strong>
                </div>
                <div class="ports-list"></div>
            </div>
        </article>
    </template>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
